name: mssql

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql

    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Password required}

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - mssql-data:/var/opt/mssql

    mem_limit: 4g

volumes:
  mssql-data:
